schema_version: "1.1"
name: explain-method-expectations
expected_outcome: |
  Lists the method's filters and ranking (tradable: ADV >= $5k and cap >= $2M; red-flag score <= 2; net income,
  operating cash flow and equity positive; rank by E/P and B/P, hold 30, rebalance yearly with a top-60 buffer),
  gives the backtest result (~9.2%/yr net vs IWM 11.4% and SPY 14.9%, 2012-2026), says it did not beat the index,
  and explains that survivorship bias makes the numbers optimistic.
