<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פריחה בע״מ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one portrait column. A sunny street with the flower shop on top, terraced garden beds below,
   and a rope-and-pulley cart shaft running down the right edge that links every bed to the shop. */
:root{
  --sky-1:#79c6ec; --sky-2:#dff3fb;
  --grass:#74c24f; --grass-2:#4e9a35;
  --wood:#8d5b35; --wood-2:#5f3b1f; --wood-3:#b07a4a;
  --petal:#e5487f; --petal-2:#b42f60;
  --sun:#ffc83d; --sun-2:#d4930c;
  --leaf:#2f8a4e; --leaf-2:#1e6236;
  --dew:#2a9bd8; --dew-2:#1b6f9e;
  --ink:#1c2a21; --ink-soft:#506256;
  --panel:#fbfdf7; --panel-2:#eef5e7; --line:#d2e2c9;
  --muted:#c9bfae; --muted-2:#a49883;
  --danger:#cf3d35;
  --page:#20361f; --soil-deep:#3a2416;
  --focus:#1b6f9e;
  --font-display:"Fredoka","Varela Round","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Assistant","Heebo","Segoe UI",system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none;
  background-image:radial-gradient(circle at 20% 10%, rgba(116,194,79,.18), transparent 40%),radial-gradient(circle at 85% 70%, rgba(229,72,127,.12), transparent 45%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative;background:var(--soil-deep);
  box-shadow:0 0 0 1px rgba(0,0,0,.25),0 30px 80px rgba(0,0,0,.4);padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));overflow-x:clip}

/* ---------- HUD ---------- */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);border-bottom:2px solid var(--line);
  padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cash-block{display:flex;align-items:center;gap:10px;min-width:0}
.coin{flex:none}
.cash{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:.2px}
.rate{font-size:13px;color:var(--ink-soft);font-weight:700}
.hud-side{display:flex;align-items:center;gap:8px;flex:none}
.dew-chip{display:flex;align-items:center;gap:5px;background:#e3f3fb;border:2px solid #b9e0f3;color:var(--dew-2);
  font-family:var(--font-display);font-weight:600;font-size:16px;border-radius:999px;padding:4px 10px 4px 12px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--panel-2);border:2px solid var(--line);display:grid;place-items:center}
.boosts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.boosts:empty{display:none}
.boost{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;background:#fff1c9;color:#7a5200;border:1.5px solid #f3d27a}
.boost.frenzy{background:#ffe0ec;color:#8f1d4a;border-color:#f6a8c5}

/* ---------- world ---------- */
#world{position:relative}
#street{position:relative;height:290px;overflow:hidden;background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 75%);cursor:pointer}
.sun{position:absolute;left:44%;top:134px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#fff6c4 0 35%,var(--sun) 36% 100%);
  box-shadow:0 0 0 8px rgba(255,214,90,.25),0 0 0 18px rgba(255,214,90,.12)}
.cloud{position:absolute;height:22px;border-radius:20px;background:#fff;opacity:.9;filter:drop-shadow(0 2px 0 rgba(120,170,200,.25))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:30px;height:30px;top:-14px;right:14px}
.cloud::after{width:22px;height:22px;top:-9px;left:12px}
.cloud.c1{width:74px;top:140px;animation:drift 70s linear infinite}
.cloud.c2{width:58px;top:176px;animation:drift 95s linear infinite;animation-delay:-40s;opacity:.75}
@keyframes drift{from{transform:translateX(620px)}to{transform:translateX(-140px)}}
.hills{position:absolute;left:0;right:0;bottom:36px;height:70px;background:
  radial-gradient(ellipse 140px 60px at 15% 100%,#8fd06a 98%,transparent 100%),
  radial-gradient(ellipse 180px 70px at 60% 100%,#7cc65a 98%,transparent 100%),
  radial-gradient(ellipse 160px 55px at 100% 100%,#8fd06a 98%,transparent 100%)}
.sidewalk{position:absolute;left:0;right:0;bottom:0;height:42px;background:
  repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.08) 46px 48px),linear-gradient(180deg,#d9cdb8 0 6px,#cbbda4 6px);background-color:#cfc2aa;border-top:3px solid #b7a88d}
.shop-bld{position:absolute;left:8px;bottom:36px;width:152px;height:128px;pointer-events:none}
.depot-bld{position:absolute;bottom:36px;width:100px;height:92px;pointer-events:none}
.headframe{position:absolute;right:0;bottom:0;width:76px;height:88px;pointer-events:none}
.depot-stock{position:absolute;bottom:132px;font-family:var(--font-display);font-weight:600;font-size:13px;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 8px;border:1.5px solid #e2d6bf;pointer-events:none;transform:translateX(-50%)}
.signs{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.sign{pointer-events:auto;background:rgba(251,253,247,.94);border:2px solid #fff;border-radius:16px;padding:7px;box-shadow:0 3px 0 rgba(40,80,60,.18);width:min(186px,48%);display:flex;flex-direction:column;gap:6px;cursor:default}
.sign-top{display:flex;align-items:center;gap:8px;min-width:0}
.sign-txt{min-width:0}
.sign-name{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-rate{font-size:12.5px;font-weight:800;color:var(--leaf-2)}
.u-rate.slow{color:var(--danger)}
.u-rate .tag{display:inline-block;background:var(--danger);color:#fff;border-radius:6px;padding:0 5px;margin-inline-start:4px;font-size:10.5px}

/* garden */
#garden{position:relative}
#track{position:absolute;right:0;top:0;bottom:0;width:76px;z-index:6;cursor:pointer;
  background:linear-gradient(90deg,#4a2c17 0 10px,#6b4325 10px 13px,#3b2213 13px 63px,#6b4325 63px 66px,#4a2c17 66px);}
#track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 30px,rgba(0,0,0,.22) 30px 34px);pointer-events:none}
.rope{position:absolute;right:37px;top:0;width:2px;background:#d8c49a;box-shadow:1px 0 0 rgba(0,0,0,.3)}
.cart{position:absolute;right:8px;top:0;width:60px;height:50px;will-change:transform;pointer-events:none}
.cart .load{opacity:0;transition:opacity .2s}
.cart.full .load{opacity:1}
.cart-label{position:absolute;right:6px;top:0;font-family:var(--font-display);font-size:11.5px;font-weight:600;background:rgba(255,255,255,.92);border-radius:999px;padding:1px 6px;will-change:transform;pointer-events:none;white-space:nowrap}
.bed{position:relative;height:128px;cursor:pointer;overflow:hidden;isolation:isolate}
.bed::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;z-index:1;background:
  radial-gradient(circle at 7px 2px,var(--grass) 6.5px,transparent 7px) 0 0/14px 12px repeat-x,
  linear-gradient(var(--grass-2),var(--grass-2)) 0 0/100% 4px no-repeat}
.bed-wall{position:absolute;left:0;right:0;top:0;height:54px}
.bed-wall::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 60%,rgba(0,0,0,.12) 2px,transparent 3px) 0 0/38px 26px,radial-gradient(circle at 70% 30%,rgba(255,255,255,.08) 2px,transparent 3px) 0 0/52px 30px}
.bed-path{position:absolute;left:0;right:0;bottom:0;height:74px;border-top:3px solid rgba(0,0,0,.18)}
.bed-path::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,0,0,.05) 22px 24px)}
.bed-top{position:absolute;top:13px;right:86px;left:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}
.bed-label{display:flex;align-items:center;gap:7px;background:rgba(251,253,247,.94);border-radius:12px;padding:4px 9px 4px 7px;min-width:0;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.bed-ico{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.bed-name{font-family:var(--font-display);font-weight:600;font-size:14.5px;line-height:1.1;white-space:nowrap}
.bed-no{font-size:11px;color:var(--ink-soft);font-weight:700}
.ctrls{display:flex;align-items:center;gap:7px;flex:none}
.patch{position:absolute;left:6px;bottom:2px;width:92px;height:72px;z-index:2;pointer-events:none;transform-origin:50% 100%}
.patch.shake{animation:shake .32s ease-in-out}
@keyframes shake{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.patch .hd{transform-box:fill-box;transform-origin:center;animation:sway 3.2s ease-in-out infinite alternate}
.patch .hd:nth-of-type(2n){animation-duration:2.6s;animation-delay:-1s}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.basket{position:absolute;right:84px;bottom:6px;width:46px;height:42px;z-index:4;pointer-events:none}
.basket .fl{opacity:0;transition:opacity .2s}
.basket.has .fl{opacity:1}
.stock{position:absolute;right:80px;bottom:50px;z-index:5;font-family:var(--font-display);font-weight:600;font-size:12.5px;background:rgba(255,255,255,.94);border-radius:999px;padding:1px 8px;border:1.5px solid rgba(0,0,0,.08);pointer-events:none}
.sprite{position:absolute;left:0;top:0;will-change:transform;pointer-events:none;z-index:4}
.sprite svg{display:block}
.sprite .cr{opacity:0}
.sprite.carrying .cr{opacity:1}
.sprite .lg{transform-box:fill-box;transform-origin:50% 0}
.sprite.walking .l1{animation:legA .34s ease-in-out infinite alternate}
.sprite.walking .l2{animation:legA .34s ease-in-out infinite alternate-reverse}
.sprite.walking .bd{animation:bob .17s ease-in-out infinite alternate}
.sprite .arm{transform-box:fill-box;transform-origin:50% 10%}
.sprite.working .arm{animation:snip .2s ease-in-out infinite alternate}
.sprite.working .bd{animation:bob .2s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes snip{from{transform:rotate(-40deg)}to{transform:rotate(-95deg)}}
.tap-hint{position:absolute;z-index:6;pointer-events:none;background:var(--sun);color:#4a3200;font-weight:800;font-size:12.5px;border-radius:999px;padding:3px 10px;box-shadow:0 3px 0 var(--sun-2);animation:hop .7s ease-in-out infinite alternate;white-space:nowrap}
.tap-hint[hidden]{display:none!important}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-5px)}}

/* controls */
.lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:86px;height:44px;padding:0 10px;border-radius:13px;
  background:linear-gradient(180deg,#e9e2d4,#d8cfbd);color:#6d6352;box-shadow:0 4px 0 var(--muted-2);transition:transform .05s}
.lvl .l1x{font-size:11.5px;font-weight:800;line-height:1.1;display:flex;align-items:center;gap:3px}
.lvl .l2x{font-family:var(--font-display);font-weight:600;font-size:14.5px;line-height:1.15}
.lvl.ok{background:linear-gradient(180deg,#7fd65a,#4fae34);color:#fff;box-shadow:0 4px 0 #2f7a1f;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.lvl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--muted-2)}
.lvl.ok:active{box-shadow:0 1px 0 #2f7a1f}
.sign .lvl{width:100%;height:40px;flex-direction:row;gap:8px}
.mgr-wrap{position:relative;flex:none}
.mgr{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mgr.empty{background:#fff8e2;border:2px dashed #d9a92c;color:#9a6a00;font-weight:800;font-size:10.5px;line-height:1;flex-direction:column;gap:1px}
.mgr.empty.ok{background:var(--sun);border:2px solid #fff;color:#4a3200;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,200,61,.35),0 3px 0 rgba(0,0,0,.25)}}
.abil{position:absolute;bottom:-6px;left:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(#9aa39c var(--pct,0%),#cfd6d0 0);box-shadow:0 2px 0 rgba(0,0,0,.25);border:2px solid #fff}
.abil.ready{background:var(--sun);animation:pulse 1s ease-in-out infinite}
.abil.active{background:conic-gradient(#3fb24f var(--pct,0%),#bfe8c5 0)}
.abil[hidden]{display:none}

/* unlock row */
.unlock{position:relative;height:150px;display:grid;place-items:center;padding:14px max(16px,env(safe-area-inset-left,0px));padding-right:92px;
  background:repeating-linear-gradient(135deg,#5b3a24 0 14px,#553620 14px 28px)}
.unlock-card{background:rgba(251,253,247,.96);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.25);max-width:100%}
.unlock-card .ico{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--line)}
.unlock-title{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.15}
.unlock-sub{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px}
.bedrock{height:90px;background:linear-gradient(180deg,#3a2416,#24150c);position:relative}
.bedrock::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 14px 8px at 30% 40%,#4d3322 98%,transparent) 0 0/90px 46px,radial-gradient(ellipse 10px 6px at 70% 70%,#4d3322 98%,transparent) 0 0/70px 40px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:10px 16px;font-weight:800;font-size:15px;
  background:linear-gradient(180deg,#7fd65a,#4fae34);color:#fff;box-shadow:0 4px 0 #2f7a1f;text-shadow:0 1px 0 rgba(0,0,0,.2);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2f7a1f}
.btn.pink{background:linear-gradient(180deg,#f36b9b,var(--petal));box-shadow:0 4px 0 var(--petal-2)}
.btn.blue{background:linear-gradient(180deg,#4db6ea,var(--dew));box-shadow:0 4px 0 var(--dew-2)}
.btn.gold{background:linear-gradient(180deg,#ffd768,var(--sun));color:#4a3200;text-shadow:none;box-shadow:0 4px 0 var(--sun-2)}
.btn.ghost{background:var(--panel-2);color:var(--ink);text-shadow:none;box-shadow:0 3px 0 var(--line)}
.btn.red{background:linear-gradient(180deg,#e9625a,var(--danger));box-shadow:0 4px 0 #8f241e}
.btn:disabled,.btn.off{background:linear-gradient(180deg,#e9e2d4,#d8cfbd);color:#8a806f;text-shadow:none;box-shadow:0 4px 0 var(--muted-2);cursor:not-allowed}
.btn.wide{width:100%}
.btn.big{padding:14px 18px;font-size:17px}

/* nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:55;pointer-events:none}
.nav-in{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--panel);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-b{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-weight:800;font-size:12.5px;color:var(--ink-soft)}
.nav-b:hover{background:var(--panel-2)}
.nav-b svg{width:26px;height:26px}
.badge{position:absolute;top:2px;left:calc(50% - 22px);min-width:19px;height:19px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--panel)}
.badge[hidden]{display:none}
.badge.dot{background:var(--sun);color:#4a3200}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
#sheetWrap[hidden]{display:none!important}
.backdrop{position:absolute;inset:0;background:rgba(20,30,22,.5);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:560px;max-height:min(84vh,760px);overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;
  padding-block:0 calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:up .22s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.sheet-head{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;z-index:2;border-bottom:2px solid var(--panel-2);margin-bottom:12px}
.sheet-head h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:21px;text-wrap:balance}
.x-btn{width:36px;height:36px;border-radius:50%;background:var(--panel-2);font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.stack{display:flex;flex-direction:column;gap:12px}
.lead{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.5;max-width:62ch}
.up-head{display:flex;align-items:center;gap:12px}
.up-ico{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--line);flex:none}
.up-title{font-family:var(--font-display);font-weight:600;font-size:19px}
.up-sub{font-size:14px;color:var(--ink-soft);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:2px solid var(--panel-2);border-radius:14px;padding:8px 10px;min-width:0}
.stat>span{display:block;font-size:12px;color:var(--ink-soft);font-weight:700}
.stat b{display:block;font-family:var(--font-display);font-weight:600;font-size:16px;margin-top:2px}
.stat i{display:block;font-style:normal;font-size:13px;font-weight:800;color:var(--leaf)}
.stat i.same{color:var(--muted-2)}
.ms{background:#fff7dc;border:2px solid #f6e2a6;border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;color:#6b4d00}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:linear-gradient(90deg,#ffcf4d,#f0a91c);border-radius:99px}
.bar.green>div{background:linear-gradient(90deg,#7fd65a,#4fae34)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:8px 0;border-radius:9px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.card{background:#fff;border:2px solid var(--panel-2);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px}
.card .grow{flex:1;min-width:0}
.card h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.25}
.card p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.4}
.card.done{border-color:#bfe6ad;background:#f4fbef}
.reward{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--dew-2);font-size:13px}
.rar{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800;color:#fff}
.mgr-hero{display:flex;align-items:center;gap:14px}
.big-num{font-family:var(--font-display);font-weight:700;font-size:30px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink-soft);font-weight:600}
.kv dd{margin:0;font-weight:800;text-align:left}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--panel-2);border-radius:14px;padding:10px 12px;font-weight:700;width:100%}
.sw{width:46px;height:28px;border-radius:99px;background:#d6d0c4;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:right .15s}
.sw.on{background:#4fae34}
.sw.on::after{right:21px}
.chain{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--panel-2);border-radius:14px;padding:10px}
.chain div{text-align:center;flex:1;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.chain svg{display:block;margin:0 auto 4px}
.chain .arr{flex:none;color:var(--muted-2);font-size:18px}

/* toasts, hint, floaters */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 92px);left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:#22322a;color:#fff;font-weight:700;font-size:14px;border-radius:14px;padding:9px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toastIn .25s ease-out;max-width:420px;text-align:center}
.toast.gold{background:#fff3c9;color:#5c4100;border:2px solid #f2cf63}
.toast.blue{background:#e1f3fc;color:#14577d;border:2px solid #a9daf2}
@keyframes toastIn{from{transform:translateY(-10px);opacity:0}}
#hint{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:56;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
#hint[hidden]{display:none!important}
.hint-in{pointer-events:auto;max-width:520px;width:100%;background:#22322a;color:#fff;border-radius:16px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toastIn .25s}
.hint-in p{margin:0;flex:1;font-weight:700;font-size:14.5px;line-height:1.35}
.hint-in button{font-size:12px;font-weight:800;color:#b9d6c3;flex:none}
.focus-ring{animation:ring 1.1s ease-in-out infinite!important;z-index:9}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,.9),0 4px 0 rgba(0,0,0,.2)}50%{box-shadow:0 0 0 9px rgba(255,200,61,0),0 4px 0 rgba(0,0,0,.2)}}
.float{position:absolute;z-index:30;pointer-events:none;font-family:var(--font-display);font-weight:700;font-size:17px;color:#fff;
  text-shadow:0 2px 0 #2f7a1f,0 0 6px rgba(0,0,0,.25);animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatUp{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-46px);opacity:0}}
.ripple{position:absolute;z-index:20;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid rgba(255,255,255,.9);pointer-events:none;animation:rip .45s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
#butterfly{position:fixed;left:0;top:0;z-index:58;width:54px;height:54px;display:grid;place-items:center;will-change:transform;filter:drop-shadow(0 0 8px rgba(255,210,70,.9))}
#butterfly[hidden]{display:none!important}
#butterfly .wl,#butterfly .wr{transform-box:fill-box;animation:flap .22s ease-in-out infinite alternate}
#butterfly .wl{transform-origin:100% 50%}
#butterfly .wr{transform-origin:0% 50%}
@keyframes flap{to{transform:scaleX(.35)}}
.petal-fx{position:fixed;top:-20px;z-index:90;pointer-events:none;width:12px;height:16px;border-radius:60% 0 60% 0;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.chain-mini{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){
  .cloud,.patch .hd,.tap-hint,.sprite.walking .bd,.sprite.working .bd{animation:none!important}
  .petal-fx{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-row">
      <div class="cash-block">
        <svg class="coin" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="#f0a91c"/><circle cx="18" cy="18" r="13" fill="#ffd25a"/><path d="M18 9c-2.6 3-6 4.2-6 8.4A6 6 0 0 0 18 23.5a6 6 0 0 0 6-6.1C24 13.2 20.6 12 18 9z" fill="#e5487f"/><path d="M18 23.5V28" stroke="#2f8a4e" stroke-width="2" stroke-linecap="round"/></svg>
        <div style="min-width:0">
          <div id="cash" class="cash num">₪0</div>
          <div class="rate"><span id="rate" class="num">₪0</span> לשנייה</div>
        </div>
      </div>
      <div class="hud-side">
        <button class="dew-chip" data-act="open:dew" aria-label="טיפות טל">
          <svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true"><path d="M8 1C5 6 2 8.6 2 12a6 6 0 0 0 12 0c0-3.4-3-6-6-11z" fill="#2a9bd8"/><path d="M5.2 12.2a2.8 2.8 0 0 0 2.6 2.8" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
          <span id="dew" class="num">0</span>
        </button>
        <button class="icon-btn" data-act="mute" id="muteBtn" aria-label="צלילים"></button>
      </div>
    </div>
    <div id="boosts" class="boosts"></div>
  </header>

  <main id="world">
    <section id="street" aria-label="הרחוב והחנות">
      <div class="sun"></div>
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="hills"></div>
      <div class="sidewalk"></div>
      <svg class="shop-bld" id="shopBld" viewBox="0 0 152 128" aria-hidden="true"></svg>
      <svg class="depot-bld" id="depotBld" viewBox="0 0 100 92" aria-hidden="true"></svg>
      <svg class="headframe" id="headframe" viewBox="0 0 76 88" aria-hidden="true"></svg>
      <div class="depot-stock num" id="depotStock">₪0</div>
      <div id="sellers"></div>
      <div class="tap-hint" id="shopTap" hidden>הקישו כדי למכור</div>
      <div class="signs">
        <div class="sign" id="shopSign">
          <div class="sign-top">
            <div class="mgr-wrap"><button class="mgr" data-act="mgr:shop" data-k="mgr"></button><button class="abil" data-act="abil:shop" data-k="abil" hidden aria-label="יכולת מנהל"></button></div>
            <div class="sign-txt"><div class="sign-name">חנות הפרחים</div><div class="u-rate" data-k="rate"></div></div>
          </div>
          <button class="lvl" data-act="upg:shop" data-k="lvl"></button>
        </div>
        <div class="sign" id="cartSign">
          <div class="sign-top">
            <div class="mgr-wrap"><button class="mgr" data-act="mgr:cart" data-k="mgr"></button><button class="abil" data-act="abil:cart" data-k="abil" hidden aria-label="יכולת מנהל"></button></div>
            <div class="sign-txt"><div class="sign-name">עגלת האיסוף</div><div class="u-rate" data-k="rate"></div></div>
          </div>
          <button class="lvl" data-act="upg:cart" data-k="lvl"></button>
        </div>
      </div>
    </section>

    <section id="garden" aria-label="הגן">
      <div id="track"><div class="rope" id="rope"></div><svg class="cart" id="cart" viewBox="0 0 60 50" aria-hidden="true"></svg><div class="cart-label num" id="cartLabel" hidden></div><div class="tap-hint" id="cartTap" hidden style="right:2px">הקישו</div></div>
      <div id="beds"></div>
      <div id="unlock" class="unlock"></div>
      <div class="bedrock"></div>
    </section>
  </main>

  <nav id="nav"><div class="nav-in">
    <button class="nav-b" data-act="open:missions"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="4" width="16" height="19" rx="3" fill="#fff" stroke="#506256" stroke-width="2"/><rect x="9" y="2" width="8" height="5" rx="2" fill="#e5487f"/><path d="M9 12l2 2 4-4M9 18h8" stroke="#2f8a4e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>משימות<span class="badge" id="bMissions" hidden></span></button>
    <button class="nav-b" data-act="open:dew"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 3C9 9 6 12 6 16a7 7 0 0 0 14 0c0-4-3-7-7-13z" fill="#2a9bd8"/><path d="M9.5 16.5a3.4 3.4 0 0 0 3.2 3.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>חנות טל</button>
    <button class="nav-b" data-act="open:festival"><svg viewBox="0 0 26 26" aria-hidden="true"><g fill="#f0a91c"><circle cx="13" cy="6.5" r="4"/><circle cx="19.2" cy="11" r="4"/><circle cx="16.8" cy="18.3" r="4"/><circle cx="9.2" cy="18.3" r="4"/><circle cx="6.8" cy="11" r="4"/></g><circle cx="13" cy="13" r="3.6" fill="#7a4a12"/></svg>פסטיבל<span class="badge dot" id="bFest" hidden>!</span></button>
    <button class="nav-b" data-act="open:settings"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 8.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm9 6.2v-3.4l-2.6-.6a7 7 0 0 0-.8-1.8l1.4-2.3-2.4-2.4-2.3 1.4a7 7 0 0 0-1.8-.8L12.9 2h-3.4l-.6 2.6a7 7 0 0 0-1.8.8L4.8 4 2.4 6.4l1.4 2.3a7 7 0 0 0-.8 1.8L.4 11.1v3.4l2.6.6c.2.6.5 1.3.8 1.8l-1.4 2.3 2.4 2.4 2.3-1.4c.6.4 1.2.6 1.8.8l.6 2.6h3.4l.6-2.6c.6-.2 1.3-.5 1.8-.8l2.3 1.4 2.4-2.4-1.4-2.3c.4-.6.6-1.2.8-1.8z" fill="#506256" transform="translate(1.6 0)"/></svg>הגדרות</button>
  </div></nav>

  <div id="hint" hidden><div class="hint-in"><p id="hintText"></p><button data-act="skiptut">דלגו</button></div></div>
  <div id="sheetWrap" hidden>
    <div class="backdrop" data-act="close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x-btn" data-act="close" aria-label="סגירה">×</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <button id="butterfly" hidden data-act="bfly" aria-label="פרפר זהב — הקישו לקבלת בונוס"></button>
</div>

<script>
(function(){
'use strict';
const D=document;
D.documentElement.lang='he'; D.documentElement.dir='rtl';
const $=s=>D.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= numbers ================= */
const SUF=['','K','M','B','T'];
for(let a=0;a<26;a++)for(let b=0;b<26;b++)SUF.push(String.fromCharCode(97+a,97+b));
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<0) return '-'+fmt(-n);
  if(n<1000) return (n<10 && n%1>0.05) ? (Math.floor(n*10)/10).toFixed(1) : Math.floor(n).toString();
  let e=Math.floor(Math.log10(n)/3);
  if(e>=SUF.length) return n.toExponential(2);
  let v=n/Math.pow(1000,e);
  if(v>=999.995 && e+1<SUF.length){v/=1000;e++;}
  const s=v<10?(Math.floor(v*100)/100).toFixed(2):v<100?(Math.floor(v*10)/10).toFixed(1):Math.floor(v).toString();
  return s+SUF[e];
}
const money=n=>'₪'+fmt(n);
const M=n=>`<span class="num">${money(n)}</span>`;
function fmtTime(sec){
  sec=Math.max(0,Math.ceil(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}
function fmtDur(sec){
  sec=Math.floor(sec);
  if(sec<60) return `${sec} שניות`;
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  if(!h) return m===1?'דקה':`${m} דקות`;
  const hs=h===1?'שעה':h===2?'שעתיים':`${h} שעות`;
  return m?`${hs} ו-${m} דקות`:hs;
}

/* ================= data ================= */
const FLOWERS=[
 {name:'כלניות',one:'כלנית',shape:'round',n:6,c:'#e3263a',c2:'#ff7a7a',k:'#2b1720'},
 {name:'חמניות',one:'חמנייה',shape:'pointed',n:14,c:'#ffc414',c2:'#ffe27a',k:'#6b3d17'},
 {name:'צבעונים',one:'צבעוני',shape:'cup',c:'#ff4f74',c2:'#ffa3b6',k:'#c22d4c'},
 {name:'לבנדר',one:'לבנדר',shape:'spike',c:'#8a6ad8',c2:'#b9a2f0',k:'#5b40a8'},
 {name:'ורדים',one:'ורד',shape:'rose',c:'#d4173f',c2:'#ff6b88',k:'#8e0f2b'},
 {name:'חרציות',one:'חרצית',shape:'thin',n:20,c:'#ff9124',c2:'#ffc172',k:'#b8560a'},
 {name:'אירוסים',one:'אירוס',shape:'iris',c:'#5a55d6',c2:'#9b97f3',k:'#ffd23f'},
 {name:'אדמוניות',one:'אדמונית',shape:'fluffy',c:'#f07fb0',c2:'#ffc4dc',k:'#ffe9f2'},
 {name:'סחלבים',one:'סחלב',shape:'orchid',c:'#c25fd3',c2:'#efb8f6',k:'#7b1f8c'},
 {name:'רקפות',one:'רקפת',shape:'cyclamen',c:'#e5489a',c2:'#ff8cc4',k:'#8a1650'},
 {name:'לוטוסים',one:'לוטוס',shape:'pointed',n:10,c:'#f37fae',c2:'#ffd0e2',k:'#ffcf3f'},
 {name:'שושנים צחורות',one:'שושן',shape:'lily',c:'#fffaf2',c2:'#f1d3b0',k:'#e39a12'},
 {name:'פריחת דובדבן',one:'דובדבן',shape:'notched',c:'#ffbcd4',c2:'#fff0f6',k:'#d84a80'},
 {name:'נוריות',one:'נורית',shape:'layered',c:'#ff5534',c2:'#ffa786',k:'#9c2a14'},
 {name:'ורדים כחולים',one:'ורד כחול',shape:'rose',c:'#3d7fe0',c2:'#9ccbff',k:'#1d4c9c',glow:true},
];
const NB=FLOWERS.length;
const B=FLOWERS.map((_,i)=>10*Math.pow(14,i));
const UF=[0,0.08,0.25,0.5,0.8];
const UNLOCK=FLOWERS.map((_,i)=>i===0?0:Math.round(B[i]*60*Math.pow(1.9,i)*(UF[i]??1)));

const cnt=(L,arr)=>{let c=0;for(const t of arr)if(L>=t)c++;return c;};
const BED_WORK_T=[10,25,50,100,200], BED_MS=[10,25,50,75,100,150,200,250,300,350,400];
const BED_WALK=1.4, HARVEST=1.0, DEPOSIT=0.3, BED_CYCLE=2*BED_WALK+HARVEST+DEPOSIT;
const CART_MS=[25,50,100,150,200,300,400], CART_SP=[10,25,50,100,150,200,300,400];
const CART_STOP=0.3, CART_UNLOAD=0.4;
const SHOP_SELL_T=[10,25,50,100,150,200,300], SHOP_MS=[25,50,100,150,200,300,400];
const SHOP_WALK=1.8, SHOP_LOAD=0.35, SHOP_SELL=0.35, SHOP_CYCLE=2*SHOP_WALK+SHOP_LOAD+SHOP_SELL;

const Econ={
  bedWorkers:L=>1+cnt(L,BED_WORK_T),
  bedLoad:(i,L)=>B[i]*L*Math.pow(2,cnt(L,BED_MS)),
  bedRate:(i,L)=>Econ.bedWorkers(L)*Econ.bedLoad(i,L)/BED_CYCLE,
  cartCap:L=>80*Math.pow(1.115,L-1)*Math.pow(1.5,cnt(L,CART_MS)),
  cartSpeed:L=>2.2+0.4*cnt(L,CART_SP),
  cartTrip:(L,n)=>2*n/Econ.cartSpeed(L)+n*CART_STOP+CART_UNLOAD,
  cartRate:(L,n)=>Econ.cartCap(L)/Econ.cartTrip(L,Math.max(1,n)),
  shopSellers:L=>1+cnt(L,SHOP_SELL_T),
  shopCap:L=>60*Math.pow(1.11,L-1)*Math.pow(1.5,cnt(L,SHOP_MS)),
  shopRate:L=>Econ.shopSellers(L)*Econ.shopCap(L)/SHOP_CYCLE,
};
const UNITS={
  bed:{r:1.105,base:i=>B[i]*3,L:i=>S.beds[i].L,set:(i,v)=>{S.beds[i].L=v;}},
  cart:{r:1.125,base:()=>50,L:()=>S.cart.L,set:(i,v)=>{S.cart.L=v;}},
  shop:{r:1.125,base:()=>60,L:()=>S.shop.L,set:(i,v)=>{S.shop.L=v;}},
};
function upgCost(kind,i,n){const u=UNITS[kind],L=u.L(i),c0=u.base(i)*Math.pow(u.r,L-1);return c0*(Math.pow(u.r,n)-1)/(u.r-1);}
function upgMax(kind,i){
  const u=UNITS[kind],L=u.L(i),c0=u.base(i)*Math.pow(u.r,L-1);
  if(S.cash<c0) return 0;
  let n=Math.floor(Math.log(S.cash*(u.r-1)/c0+1)/Math.log(u.r));
  while(n>1 && upgCost(kind,i,n)>S.cash) n--;
  return Math.max(1,n);
}
function bulkN(kind,i){const b=S.settings.bulk;return b==='max'?Math.max(1,upgMax(kind,i)):b;}

const RAR=[
  {name:'רגיל',mag:2,dur:30,cd:150,col:'#5fae4a'},
  {name:'נדיר',mag:3,dur:45,cd:150,col:'#3a8ee0'},
  {name:'אגדי',mag:5,dur:60,cd:150,col:'#e9a114'},
];
const ABIL={
  bed:[{k:'speed',name:'צעד מהיר',d:m=>`הגננים זזים פי ${m} מהר יותר`},{k:'yield',name:'קטיף ענק',d:m=>`כל קטיף שווה פי ${m}`}],
  cart:[{k:'speed',name:'טורבו',d:m=>`העגלה נוסעת פי ${m} מהר יותר`},{k:'cap',name:'ארגז ענק',d:m=>`העגלה מעמיסה פי ${m}`}],
  shop:[{k:'speed',name:'מכירת בזק',d:m=>`המוכרים זזים פי ${m} מהר יותר`},{k:'price',name:'מחיר פרימיום',d:m=>`כל מכירה שווה פי ${m}`}],
};
const NAMES=['רותי','אבי','מיכל','יוסי','נועה','דני','שירה','עומר','תמר','איתי','ליאת','גיל','הדס','אורי','מאיה','רון','יעל','בני','אלה','נדב','שני','עידו','ענבל','אסף','ציפי','משה','לאה','חיים'];
const SKINS=['#f6d1b1','#eab48c','#c98e62','#a8693f','#7a4a2c'];
const HAIRS=['#2b1d16','#5a3418','#a8642a','#e0b04a','#c44b2a','#8a8f99'];
const SHIRTS=['#e5487f','#3a8ee0','#5fae4a','#f08a24','#8a6ad8','#2bb3a3'];
function rollManager(kind){
  const x=Math.random(); const r=x<0.1?2:x<0.4?1:0;
  return {name:pick(NAMES),r,a:pick(ABIL[kind]).k,look:{s:pick(SKINS),h:pick(HAIRS),st:Math.floor(Math.random()*4),sh:pick(SHIRTS),g:Math.random()<0.3},act:0,cd:0};
}
function hireCost(kind,i){return kind==='bed'?B[i]*10:kind==='cart'?150:250;}
function rerollCost(kind,i){return Math.max(hireCost(kind,i)*3,idleRate()*45);}
const unitOf=(kind,i)=>kind==='bed'?S.beds[i]:S[kind];
const unitName=(kind,i)=>kind==='bed'?`ערוגת ה${FLOWERS[i].name}`:kind==='cart'?'עגלת האיסוף':'חנות הפרחים';
function abilMult(u,key){const m=u.mgr;return(m&&m.act>0&&m.a===key)?RAR[m.r].mag:1;}

const SEED_BONUS=0.05;
const permMult=()=>1+S.seeds*SEED_BONUS;
const tempMult=()=>(S.boosts.fert>0?2:1)*(S.boosts.frenzy>0?3:1);
const seedsTotal=()=>Math.floor(Math.cbrt(S.lifetime/1e9));
const seedsClaimable=()=>Math.max(0,seedsTotal()-S.seeds);

function rates(){
  const n=S.beds.length;let prod=0,prodM=0;
  S.beds.forEach((b,i)=>{const r=Econ.bedRate(i,b.L);prod+=r;if(b.mgr)prodM+=r;});

const Snd={ctx:null,out:null,mus:null,musT:null,step:0,deg:0,
  init(){
    if(this.ctx) return;
    try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      this.ctx=new C();this.out=this.ctx.createGain();this.out.gain.value=0.55;this.out.connect(this.ctx.destination);
      this.mus=this.ctx.createGain();this.mus.gain.value=0.5;this.mus.connect(this.out);
      if(S.settings.music) this.startMusic();
    }catch(e){this.ctx=null;}
  },
  tone(f,dur,type,vol,when,slide,dest){
    if(!this.ctx) return;
    try{
      const t=this.ctx.currentTime+(when||0);const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(dest||this.out);o.start(t);o.stop(t+dur+0.05);
    }catch(e){}
  },
  sfx(fn){if(this.ctx&&S.settings.sound){if(this.ctx.state==='suspended')this.ctx.resume();fn();}},
  coin(){const now=performance.now();if(now-RT.coinT<140)return;RT.coinT=now;this.sfx(()=>{this.tone(1175,0.07,'triangle',0.06);this.tone(1760,0.13,'triangle',0.05,0.05);});},
  tap(){this.sfx(()=>this.tone(440,0.07,'sine',0.09,0,1.6));},
  up(){this.sfx(()=>[523,659,784,1047].forEach((f,i)=>this.tone(f,0.13,'triangle',0.07,i*0.05)));},
  unlock(){this.sfx(()=>[392,523,659,784,1047,1319].forEach((f,i)=>this.tone(f,0.25,'triangle',0.07,i*0.07)));},
  err(){this.sfx(()=>this.tone(170,0.16,'square',0.035));},
  sparkle(){this.sfx(()=>[1319,1568,2093,2637,3136].forEach((f,i)=>this.tone(f,0.12,'sine',0.05,i*0.045)));},
  startMusic(){
    if(!this.ctx||this.musT) return;
    const scale=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784];
    const chords=[[130.8,196],[110,164.8],[87.3,130.8],[98,146.8]];
    this.step=0;this.deg=4;
    this.musT=setInterval(()=>{
      if(!S.settings.music||D.hidden) return;
      if(this.ctx.state==='suspended') this.ctx.resume();
      const st=this.step++;
      if(st%8===0){const ch=chords[(st/8|0)%4];ch.forEach(f=>this.tone(f,2.6,'sine',0.035,0,0,this.mus));}
      if(Math.random()<0.72){this.deg=clamp(this.deg+pick([-2,-1,-1,1,1,2]),0,scale.length-1);this.tone(scale[this.deg],0.9,'triangle',0.028,0,0,this.mus);}
    },330);
  },
  stopMusic(){if(this.musT){clearInterval(this.musT);this.musT=null;}},
};

  for(let k=0;k<Econ.shopSellers(S.shop.L);k++){const s=newWorker(k);s.delay=k*0.4;RT.sellers.push(s);mountSeller(s);}

/* ================= game logic ================= */
function earn(v,silent){
  if(!(v>0)) return;
  const g=v*permMult()*tempMult();
  S.cash+=g;S.lifetime+=g;S.run+=g;RT.emaAcc+=g;
  if(!silent){RT.floatAcc+=g;Snd.coin();}
}
function addCash(g){S.cash+=g;S.lifetime+=g;S.run+=g;}

function stepBeds(dt){
  for(let i=0;i<S.beds.length;i++){
    const b=S.beds[i],r=RT.beds[i];
    const need=Econ.bedWorkers(b.L);
    while(r.workers.length<need){const w=newWorker(r.workers.length);w.delay=0.1;r.workers.push(w);mountWorker(i,w);}
    const sp=abilMult(b,'speed'),auto=!!b.mgr;
    for(const w of r.workers){
      switch(w.state){
        case 'idle': if(auto){w.delay-=dt;if(w.delay<=0)w.state='out';} break;
        case 'wait': w.delay-=dt*sp;if(w.delay<=0)w.state='out'; break;
        case 'out': w.p+=dt*sp/BED_WALK;if(w.p>=1){w.p=1;w.state='cut';w.t=0;shake(r.patch);} break;
        case 'cut': w.t+=dt*sp;if(w.t>=HARVEST){w.carry=Econ.bedLoad(i,b.L)*abilMult(b,'yield');w.state='back';} break;
        case 'back': w.p-=dt*sp/BED_WALK;if(w.p<=0){w.p=0;w.state='drop';w.t=0;} break;
        case 'drop': w.t+=dt*sp;if(w.t>=DEPOSIT){b.stock+=w.carry;w.carry=0;w.state='idle';w.delay=auto?rnd(0.02,0.2):0;} break;
      }
    }
  }
}
function shake(el){el.classList.remove('shake');void el.getBoundingClientRect;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),340);}
function stepCart(dt){
  const c=RT.cart,u=S.cart,n=S.beds.length;
  const sm=abilMult(u,'speed'),spd=Econ.cartSpeed(u.L)*sm,cap=Econ.cartCap(u.L)*abilMult(u,'cap');
  switch(c.state){
    case 'idle': if(u.mgr||c.tap){c.tap=false;c.state='down';c.target=0;c.load=0;} break;
    case 'down': c.p+=dt*spd;if(c.p>=c.target+1){c.p=c.target+1;c.state='load';c.t=0;} break;
    case 'load':{
      const b=S.beds[c.target];const stopT=(b&&b.stock>0)?CART_STOP:0.04;
      c.t+=dt*sm;
      if(c.t>=stopT){
        if(b&&b.stock>0){const take=Math.min(b.stock,cap-c.load);b.stock-=take;c.load+=take;if(b.stock<1e-9*take)b.stock=0;}
        if(c.load>=cap*0.9999||c.target>=n-1) c.state='up'; else {c.target++;c.state='down';}
      }
      break;}
    case 'up': c.p-=dt*spd;if(c.p<=0){c.p=0;c.state='unload';c.t=0;} break;
    case 'unload': c.t+=dt*sm;if(c.t>=CART_UNLOAD){S.depot+=c.load;c.load=0;c.state='idle';} break;
  }
}
function stepShop(dt){
  const u=S.shop,need=Econ.shopSellers(u.L);
  while(RT.sellers.length<need){const s=newWorker(RT.sellers.length);s.delay=0.2;RT.sellers.push(s);mountSeller(s);}
  const sp=abilMult(u,'speed'),cap=Econ.shopCap(u.L),auto=!!u.mgr;
  for(const s of RT.sellers){
    switch(s.state){
      case 'idle':
        if(auto&&S.depot>0){s.delay-=dt;if(s.delay<=0)startSeller(s,cap);}
        break;
      case 'wait': s.delay-=dt;if(s.delay<=0){if(S.depot>0)startSeller(s,cap);else s.state='idle';} break;
      case 'load': s.t+=dt*sp;if(s.t>=SHOP_LOAD)s.state='out'; break;
      case 'out': s.p+=dt*sp/SHOP_WALK;if(s.p>=1){s.p=1;s.state='sell';s.t=0;} break;
      case 'sell': s.t+=dt*sp;if(s.t>=SHOP_SELL){earn(s.carry*abilMult(u,'price'));s.carry=0;s.state='back';} break;
      case 'back': s.p-=dt*sp/SHOP_WALK;if(s.p<=0){s.p=0;s.state='idle';s.delay=auto?rnd(0.05,0.35):0;} break;
    }
  }
}
function startSeller(s,cap){s.carry=Math.min(S.depot,cap);S.depot-=s.carry;if(S.depot<1e-9*s.carry)S.depot=0;s.state='load';s.t=0;}

function tapBed(i){
  if(S.beds[i].mgr) return;
  let n=0;RT.beds[i].workers.forEach((w,k)=>{if(w.state==='idle'){w.state='wait';w.delay=k*0.16;n++;}});
  if(n){Snd.tap();S.stats.taps++;}
}
function tapCart(){
  if(S.cart.mgr) return;
  if(RT.cart.state==='idle'){RT.cart.tap=true;Snd.tap();S.stats.taps++;}
}
function tapShop(){
  if(S.shop.mgr) return;
  if(S.depot<=0){if(RT.sellers.every(s=>s.state==='idle'))toast('המחסן ריק. העלו פרחים עם העגלה קודם.');return;}
  let n=0;RT.sellers.forEach((s,k)=>{if(s.state==='idle'){s.state='wait';s.delay=k*0.25;n++;}});
  if(n){Snd.tap();S.stats.taps++;}
}

function stepTimers(dt){
  for(const k in S.boosts) S.boosts[k]=Math.max(0,S.boosts[k]-dt);
  const tick=u=>{if(u.mgr){u.mgr.act=Math.max(0,u.mgr.act-dt);u.mgr.cd=Math.max(0,u.mgr.cd-dt);}};
  S.beds.forEach(tick);tick(S.cart);tick(S.shop);
}
function step(dt){
  stepTimers(dt);stepBeds(dt);stepCart(dt);stepShop(dt);stepButterfly(dt);
  S.stats.play+=dt;
  RT.emaT+=dt;
  if(RT.emaT>=1){const r=RT.emaAcc/RT.emaT;RT.ema=RT.ema?RT.ema+(r-RT.ema)*0.18:r;RT.emaAcc=0;RT.emaT=0;}
  RT.floatT+=dt;
  if(RT.floatT>=0.4){RT.floatT=0;if(RT.floatAcc>0){floatText('+'+money(RT.floatAcc),RT.sx1+20,STREET_H-110);RT.floatAcc=0;}}
}

/* ================= actions ================= */
function buyUpgrade(kind,i){
  const n=bulkN(kind,i),cost=upgCost(kind,i,n);
  if(S.cash<cost){Snd.err();toast('אין מספיק כסף לשדרוג הזה.');return false;}
  S.cash-=cost;const u=UNITS[kind];u.set(i,u.L(i)+n);Snd.up();
  return true;
}
function hire(kind,i){
  const u=unitOf(kind,i),c=hireCost(kind,i);
  if(u.mgr) return;
  if(S.cash<c){Snd.err();toast('אין מספיק כסף לגיוס.');return;}
  S.cash-=c;u.mgr=rollManager(kind);Snd.unlock();
  toast(`גייסתם את ${u.mgr.name}! דרגה: ${RAR[u.mgr.r].name}`,'gold');
}
function reroll(kind,i){
  const u=unitOf(kind,i),c=rerollCost(kind,i);
  if(S.cash<c){Snd.err();toast('אין מספיק כסף להחלפה.');return;}
  S.cash-=c;u.mgr=rollManager(kind);Snd.unlock();
  toast(`גייסתם את ${u.mgr.name} במקום. דרגה: ${RAR[u.mgr.r].name}`,'gold');
}

/* ================= butterfly ================= */
const bEl=$('#butterfly');bEl.innerHTML=BFLY;
function stepButterfly(dt){
  const b=RT.bfly;
  if(b.a){
    const a=b.a;a.t+=dt;
    const k=a.t/a.dur;
    if(k>=1){bEl.hidden=true;b.a=null;b.t=rnd(70,140);return;}
    const vw=innerWidth,vh=innerHeight;
    const x=a.dir>0?-60+(vw+120)*k:vw+60-(vw+120)*k;
    const y=clamp(a.y0*vh+Math.sin(a.t*1.7)*50+Math.sin(a.t*4.3)*10,110,vh-170);
    bEl.style.transform=`translate(${x-27}px,${y-27}px) scaleX(${a.dir>0?1:-1})`;
  }else{
    b.t-=dt;
    if(b.t<=0&&!D.hidden&&S.stats.play>40){b.a={t:0,dur:11,dir:Math.random()<.5?1:-1,y0:rnd(0.25,0.6)};bEl.hidden=false;}
  }
}
function catchButterfly(){
  if(!RT.bfly.a) return;
  RT.bfly.a=null;bEl.hidden=true;RT.bfly.t=rnd(70,140);S.stats.butterflies++;Snd.sparkle();
  const x=Math.random(),rate=Math.max(idleRate()*tempMult(),RT.ema);
  if(x<0.25){const n=3+Math.floor(Math.random()*3);S.dew+=n;toast(`פרפר הזהב הביא ${n} טיפות טל!`,'blue');}
  else if(x<0.55&&rate>0){S.boosts.frenzy=Math.max(S.boosts.frenzy,30);toast('פריחת שיא! כל ההכנסות פי 3 למשך 30 שניות','gold');}
  else{const g=Math.max(50,rate*90);addCash(g);toast(`פרפר הזהב הביא ${money(g)}!`,'gold');}
  petals(14,true);
}

function floatText(txt,x,y){

  el.style.left=x+'px';el.style.top=y+'px';streetEl.appendChild(el);setTimeout(()=>el.remove(),1150);

function ripple(ev,host){

  el.style.left=(ev.clientX-r.left)+'px';el.style.top=(ev.clientY-r.top)+'px';host.appendChild(el);setTimeout(()=>el.remove(),460);

function petals(n,gold){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=gold?['#ffc83d','#ffe27a','#f0a91c']:['#e5487f','#ffbcd4','#ffc414','#8a6ad8','#ff7a7a','#fff'];
  for(let i=0;i<n;i++){
    const el=D.createElement('div');el.className='petal-fx';

function toast(msg,kind){

/* ================= render (per frame) ================= */
function setCls(o,walking,working,carrying,flip){
  const key=(walking?1:0)+(working?2:0)+(carrying?4:0);
  if(o.cls!==key){o.cls=key;o.el.classList.toggle('walking',walking);o.el.classList.toggle('working',working);o.el.classList.toggle('carrying',carrying);}
  return flip;
}
function render(){
  for(let i=0;i<S.beds.length;i++){
    const r=RT.beds[i];
    for(const w of r.workers){
      const x1=RT.bx1+w.k*7;const x=RT.bx0+(x1-RT.bx0)*w.p;const y=BED_H-46-8+WORKER_Y[w.k%6];
      const walking=w.state==='out'||w.state==='back',working=w.state==='cut',carrying=w.carry>0||w.state==='drop';
      setCls(w,walking,working,carrying);
      const flip=w.state==='back'||w.state==='drop'?1:-1;
      w.el.style.transform=`translate(${x.toFixed(1)}px,${y}px) scaleX(${flip})`;
      w.el.style.zIndex=10+y;
    }
  }
  for(const s of RT.sellers){
    const x=RT.sx0+(RT.sx1+(s.k%4)*6-RT.sx0)*s.p;const y=STREET_H-46-4+[0,-6,3,-3,5,-8,2,-5][s.k%8];
    const walking=s.state==='out'||s.state==='back';setCls(s,walking,s.state==='sell'||s.state==='load',s.carry>0);
    const flip=s.state==='back'?1:-1;
    s.el.style.transform=`translate(${x.toFixed(1)}px,${y}px) scaleX(${flip})`;
  }
  const c=RT.cart,p=c.p;
  const y=p<=1?6+p*(62-6):62+(p-1)*BED_H;
  const cartEl=$('#cart');cartEl.style.transform=`translateY(${y.toFixed(1)}px)`;
  cartEl.classList.toggle('full',c.load>0);
  $('#rope').style.height=(y+4)+'px';
  const lab=$('#cartLabel');
  if(c.load>0){lab.hidden=false;lab.textContent=money(c.load);lab.style.transform=`translateY(${(y+52).toFixed(1)}px)`;}else lab.hidden=true;
  const sp=D.getElementById('spokes');if(sp)sp.setAttribute('transform',`rotate(${(p*140)%360})`);
}

function nextMs(L,list){for(const t of list) if(L<t) return t;return null;}

    }else{
      head=`<div class="up-head"><div class="up-ico"><svg width="44" height="40" viewBox="0 0 152 128">${shopSVG()}</svg></div><div><div class="up-title">חנות הפרחים</div><div class="up-sub">רמה ${L} ← ${L2}</div></div></div>`;
      stats=statBox('מוכרים',Econ.shopSellers(L),Econ.shopSellers(L2))+statBox('זרים למוכר',money(Econ.shopCap(L)),money(Econ.shopCap(L2)))+statBox('מכירה לשנייה',money(Econ.shopRate(L)*pm),money(Econ.shopRate(L2)*pm));
      const nm=nextMs(L,[...new Set([...SHOP_MS,...SHOP_SELL_T])].sort((a,b)=>a-b));
      if(nm){const parts=[];if(SHOP_SELL_T.includes(nm))parts.push('מוכר/ת נוסף/ת');if(SHOP_MS.includes(nm))parts.push('קיבולת פי 1.5');ms=`<div class="ms">ברמה ${nm}: ${parts.join(' + ')}</div>`;}
    }
    return {title:'שדרוג',html:`<div class="stack">${head}<div class="stats">${stats}</div>${ms}${bulkSeg()}
      <button class="btn big wide ${ok?'':'off'}" data-act="buy">שדרגו ${n>1?'×'+n+' ':''}· ${M(cost)}</button></div>`};
  },
  mgr(sp){
    const {kind,i}=sp,u=unitOf(kind,i),nm=unitName(kind,i);
    if(!u.mgr){
      const c=hireCost(kind,i),ok=S.cash>=c;
      return {title:'גיוס מנהל',html:`<div class="stack"><p class="lead">מנהל ב${nm} מפעיל את העבודה בלי שתצטרכו להקיש, וממשיך להרוויח גם כשהמשחק סגור. לכל מנהל יש גם יכולת מיוחדת שאפשר להפעיל.</p>
        <div class="chain"><div><b style="color:${RAR[0].col}">רגיל</b><br>פי 2</div><div><b style="color:${RAR[1].col}">נדיר</b><br>פי 3</div><div><b style="color:${RAR[2].col}">אגדי</b><br>פי 5</div></div>
        <button class="btn big wide gold ${ok?'':'off'}" data-act="hire">גייסו מנהל · ${M(c)}</button></div>`};
    }
    const m=u.mgr,R=RAR[m.r],ab=ABIL[kind].find(a=>a.k===m.a),rc=rerollCost(kind,i);
    const state=m.act>0?'active':m.cd>0?'cd':'ready';
    const live={st:state==='active'?`פעיל עוד ${fmtTime(m.act)}`:state==='cd'?`מוכן בעוד ${fmtTime(m.cd)}`:'מוכן להפעלה'};
    return {title:'המנהל',live,html:`<div class="stack">
      <div class="mgr-hero">${portraitSVG(m,78)}<div><div class="up-title">${m.name}</div><div class="up-sub">${nm}</div><span class="rar" style="background:${R.col}">${R.name}</span></div></div>
      <div class="card"><div class="grow"><h3>${ab.name}</h3><p>${ab.d(R.mag)} למשך ${R.dur} שניות. זמן טעינה: ${Math.round(R.cd/60*10)/10} דקות.</p><p style="font-weight:800;color:var(--ink)" data-live="st"></p></div>
      <button class="btn gold ${state==='ready'?'':'off'}" data-act="abil:${kind}${kind==='bed'?':'+i:''}">${BOLT} הפעילו</button></div>
      <button class="btn ghost wide" data-act="reroll">החליפו במנהל אקראי אחר · ${M(rc)}</button></div>`};
  },
  missions(){
    const act=activeMissions();
    const rows=act.map(i=>{const d=missionDef(i);const [a,b]=d.p(S);const done=a>=b;const pct=clamp(a/b,0,1)*100;
      const prog=d.money?`${money(Math.min(a,b))} / ${money(b)}`:`${fmt(Math.min(a,b))} / ${fmt(b)}`;
      return `<div class="card ${done?'done':''}"><div class="grow"><h3>${d.t}</h3><div class="bar green"><div style="width:${pct.toFixed(0)}%"></div></div><p><span class="num">${prog}</span> · <span class="reward">${DROP}+${d.r}</span></p></div>
      ${done?`<button class="btn blue" data-act="claim:${i}">קבלו</button>`:''}</div>`;}).join('');
    return {title:'משימות',html:`<div class="stack"><p class="lead">השלימו משימות כדי לאסוף טיפות טל, המטבע המיוחד של הגן.</p>${rows}<p class="lead" style="font-size:13px">הושלמו עד עכשיו: ${S.claimed.length}</p></div>`};
  },
  dew(){
    const items=DEW_ITEMS.map(it=>{const ok=S.dew>=it.cost&&!(it.k==='cap'&&S.offlineH>=12);
      return `<div class="card"><div class="grow"><h3>${it.name}</h3><p>${it.d}${it.k==='cap'?` כרגע: ${S.offlineH} שעות.`:''}</p></div><button class="btn blue ${ok?'':'off'}" data-act="dewbuy:${it.k}">${DROP} ${it.cost}</button></div>`;}).join('');
    return {title:'חנות הטל',html:`<div class="stack"><div class="mgr-hero"><div class="up-ico">${DROP.replace('width="13" height="15"','width="30" height="34"')}</div><div><div class="big-num num">${fmt(S.dew)}</div><div class="up-sub">טיפות טל. משיגים ממשימות, מפרפרי זהב ומפסטיבלים.</div></div></div>${items}</div>`};
  },
  festival(){
    const n=seedsClaimable(),cur=permMult(),next=1+(S.seeds+n)*SEED_BONUS;
    const need=Math.pow(S.seeds+1,3)*1e9;
    return {title:'פסטיבל הפריחה',html:`<div class="stack">
      <p class="lead">בסוף העונה עורכים פסטיבל: מוכרים את הגן ומתחילים מחדש עם זרעי זהב. כל זרע מעלה את כל ההכנסות ב-5% לתמיד.</p>
      <div class="stats" style="grid-template-columns:repeat(2,1fr)">
        <div class="stat"><span>זרעי זהב שיש לכם</span><b class="num">${fmt(S.seeds)}</b><i class="same">הכנסה ×${cur.toFixed(2)}</i></div>
        <div class="stat"><span>תקבלו בפסטיבל</span><b class="num">+${fmt(n)}</b><i>הכנסה ×${next.toFixed(2)}</i></div>
      </div>
      ${n<1?`<div class="ms">הזרע הבא מגיע כשהרווח הכולל יגיע ל-${M(need)}. כרגע: ${M(S.lifetime)}.</div>`:''}
      <div class="card"><div class="grow"><h3>מה מתאפס</h3><p>כסף, ערוגות, רמות, עגלה, חנות ומנהלים.</p><h3 style="margin-top:8px">מה נשאר</h3><p>זרעי זהב, טיפות טל (ועוד 10 במתנה), משימות, דשן פעיל וגודל החממה.</p></div></div>
      ${sp_confirm('fest',n>=1,`חגגו פסטיבל · +${fmt(n)} זרעים`,'כן, אפסו את הגן וחגגו','gold')}</div>`};
  },
  settings(){
    const st=S.stats;
    return {title:'הגדרות',html:`<div class="stack">
      <button class="toggle" data-act="toggle:sound">צלילים<span class="sw ${S.settings.sound?'on':''}"></span></button>
      <button class="toggle" data-act="toggle:music">מוזיקת רקע<span class="sw ${S.settings.music?'on':''}"></span></button>
      <div class="card" style="display:block"><h3 style="margin-bottom:8px">איך משחקים</h3><p>גננים קוטפים פרחים לסל שבקצה הערוגה. עגלת האיסוף עולה ויורדת בפיר ומביאה את הפרחים למחסן. המוכרים לוקחים זרים מהמחסן לחנות ומוכרים. אם אחד מהשלושה איטי, התגית "איטי" תראה לכם מה לשדרג.</p></div>
      <div class="card" style="display:block"><h3 style="margin-bottom:8px">סטטיסטיקה</h3><dl class="kv">
        <dt>רווח כולל</dt><dd>${M(S.lifetime)}</dd><dt>רווח בעונה הזו</dt><dd>${M(S.run)}</dd><dt>שיא הכנסה לשנייה</dt><dd>${M(st.bestRate||0)}</dd>
        <dt>זמן משחק</dt><dd>${fmtDur(st.play)}</dd><dt>פסטיבלים</dt><dd class="num">${st.festivals}</dd><dt>פרפרי זהב</dt><dd class="num">${st.butterflies}</dd><dt>הקשות</dt><dd class="num">${fmt(st.taps)}</dd></dl></div>
      <p class="lead" style="font-size:13px">ההתקדמות נשמרת אוטומטית בדפדפן הזה.</p>
      ${sp_confirm('reset',true,'התחילו גן חדש מאפס','כן, מחקו את כל ההתקדמות','red')}</div>`};
  },
  offline(){
    const p=RT.pending;if(!p) return {title:'',html:''};
    return {title:'ברוכים השבים!',html:`<div class="stack" style="text-align:center;align-items:center">
      <p class="lead">בזמן שלא הייתם (${fmtDur(p.away)}) המנהלים המשיכו לעבוד.${p.capped?` החממה שומרת עד ${S.offlineH} שעות.`:''}</p>
      <div class="big-num num">${money(p.gain)}</div>
      <button class="btn big wide" data-act="collect">אספו</button>
      <button class="btn wide blue ${S.dew>=10?'':'off'}" data-act="collect2">הכפילו ל-${M(p.gain*2)} · ${DROP} 10</button></div>`};
  },
  welcome(){
    const ch=(svg,t)=>`<div>${svg}${t}</div>`;
    return {title:'ברוכים הבאים לפריחה בע״מ',html:`<div class="stack">
      <p class="lead">קיבלתם ערוגת כלניות קטנה, עגלה וחנות פרחים ברחוב. הפכו אותם לאימפריית פרחים.</p>
      <div class="chain">${ch(flowerIcon(FLOWERS[0],34),'גננים קוטפים')}<span class="arr">←</span>${ch(`<svg width="38" height="32" viewBox="0 0 60 50">${cartSVG()}</svg>`,'העגלה מעלה')}<span class="arr">←</span>${ch(`<svg width="38" height="32" viewBox="0 0 152 128">${shopSVG()}</svg>`,'המוכרים מוכרים')}</div>
      <p class="lead">בהתחלה מקישים כדי להפעיל כל שלב. אחר כך מגייסים מנהלים, מוסיפים ערוגות של פרחים יקרים יותר, ובסוף העונה חוגגים פסטיבל.</p>
      <button class="btn big wide pink" data-act="close">בואו נתחיל</button></div>`};
  },
};
function sp_confirm(key,enabled,label,confirmLabel,color){
  const armed=RT.sheet&&RT.sheet.arm===key;
  if(!enabled) return `<button class="btn big wide off" disabled>${label}</button>`;
  if(!armed) return `<button class="btn big wide ${color==='red'?'ghost':color}" data-act="arm:${key}">${label}</button>`;
  return `<div class="stack"><p class="lead" style="text-align:center;font-weight:800;color:var(--ink)">בטוחים? אי אפשר לבטל את זה.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn ghost" data-act="disarm">ביטול</button><button class="btn ${color}" data-act="do:${key}">${confirmLabel}</button></div></div>`;
}

/* ================= offline ================= */
function handleAway(sec,showModal){
  if(!(sec>1)) return;
  const capS=S.offlineH*3600,use=Math.min(sec,capS);
  const rate=idleRate();
  stepTimers(sec);
  const gain=rate*use;
  if(gain<=0) return;
  if(showModal&&sec>=60){
    if(RT.pending){RT.pending.gain+=gain;RT.pending.away+=sec;}
    else RT.pending={gain,away:sec,capped:sec>capS};
    openSheet({type:'offline'});
  }else addCash(gain);
}
function collectOffline(double){
  const p=RT.pending;if(!p) return;
  let g=p.gain;
  if(double){if(S.dew<10){Snd.err();toast('אין מספיק טיפות טל.','blue');return;}S.dew-=10;g*=2;}
  addCash(g);RT.pending=null;Snd.coin();petals(18,true);toast(`אספתם ${money(g)}`,'gold');
}

/* ================= input ================= */
D.addEventListener('pointerdown',()=>Snd.init(),{once:false,passive:true});
D.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(t){ev.stopPropagation();handleAct(t.dataset.act,t);return;}
  const bed=ev.target.closest('.bed');
  if(bed){ripple(ev,bed);tapBed(+bed.dataset.bed);return;}
  if(ev.target.closest('#track')){ripple(ev,$('#track'));tapCart();return;}
  if(ev.target.closest('#street')&&!ev.target.closest('.sign')){ripple(ev,streetEl);tapShop();return;}
});
function handleAct(a,el){
  const [v,x,y]=a.split(':');
  const ki=()=>({kind:x,i:x==='bed'?+y:0});
  switch(v){
    case 'open': openSheet({type:x}); break;
    case 'close': closeSheet(); break;
    case 'upg': {const k=ki();openSheet({type:'upg',...k});break;}
    case 'mgr': {const k=ki();openSheet({type:'mgr',...k});break;}
    case 'abil': {const k=ki();activate(k.kind,k.i);break;}
    case 'buy': {const sp=RT.sheet;if(sp&&sp.type==='upg')buyUpgrade(sp.kind,sp.i);break;}
    case 'bulk': S.settings.bulk=x==='max'?'max':+x;break;
    case 'hire': {const sp=RT.sheet;if(sp)hire(sp.kind,sp.i);break;}
    case 'reroll': {const sp=RT.sheet;if(sp)reroll(sp.kind,sp.i);break;}
    case 'unlock': unlockBed();break;
    case 'claim': claimMission(+x);break;
    case 'dewbuy': buyDew(x);break;
    case 'arm': if(RT.sheet)RT.sheet.arm=x;break;
    case 'disarm': if(RT.sheet)RT.sheet.arm=null;break;
    case 'do': if(x==='fest')festival();else if(x==='reset')resetGame();break;
    case 'toggle':
      S.settings[x]=!S.settings[x];
      if(x==='music'){Snd.init();if(S.settings.music)Snd.startMusic();else Snd.stopMusic();}
      updMute();break;
    case 'mute': S.settings.sound=!S.settings.sound;if(!S.settings.sound){S.settings.music=false;Snd.stopMusic();}updMute();toast(S.settings.sound?'הצלילים פועלים':'הצלילים כבויים');break;
    case 'collect': collectOffline(false);closeSheet();break;
    case 'collect2': {const had=S.dew>=10;collectOffline(true);if(had)closeSheet();break;}
    case 'skiptut': S.tut=99;break;
    case 'bfly': catchButterfly();break;
  }
  updUI();
}
function updMute(){$('#muteBtn').innerHTML=S.settings.sound?SPK_ON:SPK_OFF;}
D.addEventListener('keydown',e=>{if(e.key==='Escape'&&RT.sheet)closeSheet();});

/* ================= loop ================= */
function frame(now){
  const wall=Date.now();
  let gap=(wall-RT.lastWall)/1000;RT.lastWall=wall;
  if(gap>2){handleAway(gap,true);gap=0;}
  let dt=Math.min(Math.max(gap,0),0.1);
  while(dt>0){const d=Math.min(dt,0.05);step(d);dt-=d;}
  render();
  RT.uiT+=gap;RT.saveT+=gap;
  if(RT.uiT>=0.2){RT.uiT=0;updUI();}
  if(RT.saveT>=8){RT.saveT=0;save();}
  requestAnimationFrame(frame);
}
D.addEventListener('visibilitychange',()=>{if(D.hidden)save();});
addEventListener('pagehide',save);
addEventListener('resize',()=>layout());

/* ================= boot ================= */
function start(data){
  let loaded=null;
  if(data&&data.save) loaded=data.save;
  else{try{const raw=localStorage.getItem(SAVE_KEY);if(raw)loaded=JSON.parse(raw);}catch(e){}}
  S=loaded?loadFrom(loaded):newState();
  RT=newRT();
  $('#shopBld').innerHTML=shopSVG();$('#depotBld').innerHTML=depotSVG();$('#headframe').innerHTML=headframeSVG();$('#cart').innerHTML=cartSVG();
  updMute();buildWorld();
  const away=(Date.now()-(S.last||Date.now()))/1000;
  if(loaded&&away>30&&!(data&&data.save)) handleAway(away,true);
  updUI();RT.started=true;
  if(!S.welcomed) openSheet({type:'welcome'});
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({save:serialize()}));}catch(e){}
  RT.lastWall=Date.now();
  requestAnimationFrame(frame);
  window.Pericha={get S(){return S;},get RT(){return RT;},step,Econ,save,idleRate};
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
})();
</script>
</body>
